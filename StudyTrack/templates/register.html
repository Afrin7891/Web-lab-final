{% extends "base.html" %}

{% block title %}Register - UniPlan{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

        <div class="card border-0 shadow-lg register-card">

            <div class="card-body p-4 p-md-5">

                <!-- Header -->
                <div class="text-center mb-4">

                    <div class="auth-icon">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>

                    <h2 class="fw-bold mt-3">
                        Create Your Account
                    </h2>

                    <p class="text-secondary">
                        Join UniPlan and organize your academic life.
                    </p>

                </div>


                <!-- Registration Form -->
                <form
                    method="POST"
                    action="{{ url_for('register') }}"
                    id="registerForm"
                >

                    <!-- Name -->
                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label fw-semibold"
                        >
                            Full Name
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Enter your full name"
                                required
                                autocomplete="name"
                            >

                        </div>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label fw-semibold"
                        >
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="example@email.com"
                                required
                                autocomplete="email"
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label fw-semibold"
                        >
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                minlength="6"
                                required
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword('password', this)"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                        <small class="text-secondary">
                            Password must contain at least 6 characters.
                        </small>

                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-4">

                        <label
                            for="confirm_password"
                            class="form-label fw-semibold"
                        >
                            Confirm Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-shield-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Re-enter your password"
                                minlength="6"
                                required
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword('confirm_password', this)"
                            >
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Terms -->
                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label
                            class="form-check-label text-secondary"
                            for="terms"
                        >
                            I agree to use UniPlan for academic planning
                            and study management.
                        </label>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn btn-primary w-100 py-2"
                    >
                        <i class="bi bi-person-plus"></i>
                        Create Account
                    </button>

                </form>


                <!-- Login Link -->
                <div class="text-center mt-4">

                    <p class="text-secondary mb-0">
                        Already have an account?
                        <a
                            href="{{ url_for('login') }}"
                            class="text-primary fw-semibold text-decoration-none"
                        >
                            Login here
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
